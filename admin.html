<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>

        <h2>Add Teacher</h2>
        <form id="addTeacherForm">
            <input type="text" id="teacherName" placeholder="Enter teacher name" required>
            <input type="password" id="teacherPassword" placeholder="Enter teacher password" required>
            <input type="text" id="teacherClass" placeholder="Enter teacher's class (e.g., Class 1)" required>
            <button type="submit">Add Teacher</button>
        </form>

        <h2>Teacher List</h2>
        <div id="teacherList"></div>

        <h2>Reports</h2>
        <button onclick="viewReports()">View Attendance Reports</button>
        <div id="reports"></div>

        <h2>View Attendance by Date Range</h2>
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate">
        <label for="endDate">End Date:</label>
        <input type="date" id="endDate">
        <button onclick="viewReportsByDate()">View Report</button>

        <h2>Filter by Class</h2>
        <label for="classFilter">Class:</label>
        <select id="classFilter" onchange="filterByClass()">
            <option value="">All Classes</option>
        </select>

        <button class="logout" onclick="logout()">Logout</button>
    </div>

    <script src="./js/admin.js"></script>
</body>
</html>
